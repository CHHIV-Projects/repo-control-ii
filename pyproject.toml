[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoctl"
version = "0.1.0"
description = "Repo Control Plane deterministic scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"flask>=3.0,<4",
]

[project.scripts]
repoctl = "repoctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
